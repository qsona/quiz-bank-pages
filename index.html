<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="quiz-bank の問題を一覧で確認する制作・レビュー用ブラウザ">
    <meta name="theme-color" content="#225f4b">
    <title>Quiz Bank Browser</title>
    <link rel="stylesheet" href="./styles.css?v=20260727-focus">
    <script src="./app.js?v=20260727-search-scope" defer></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="Quiz Bank Browser ホーム">
        <span class="brand__mark" aria-hidden="true">Q</span>
        <span>QUIZ BANK</span>
      </a>
      <p class="breadcrumb">
        Browse / <span id="breadcrumb-theme">読み込み中</span>
      </p>
      <p class="source-meta" id="source-meta">データを読み込んでいます</p>
    </header>

    <main class="page">
      <section class="hero" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">QUESTION BROWSER</p>
          <h1 id="page-title">クイズ集</h1>
          <p class="hero__description">
            問題文と解答データを、制作・レビュー用に一覧で確認します。
          </p>
        </div>
        <dl class="stats" aria-label="クイズ集の集計">
          <div class="stat">
            <dt>全問題</dt>
            <dd id="stat-total">—</dd>
          </div>
          <div class="stat">
            <dt>平均難易度</dt>
            <dd id="stat-difficulty">—</dd>
          </div>
          <div class="stat">
            <dt>出典確認済み</dt>
            <dd id="stat-checked">—</dd>
          </div>
        </dl>
      </section>

      <section class="controls" aria-label="問題の絞り込み">
        <label class="control control--search">
          <span class="control__label">検索</span>
          <span class="search-icon" aria-hidden="true"></span>
          <input
            id="search-input"
            type="search"
            placeholder="問題文・答え・別解・タグ・IDから検索"
            autocomplete="off"
          >
          <kbd class="search-shortcut">/</kbd>
        </label>

        <label class="control">
          <span class="control__label">テーマ</span>
          <select id="theme-select" aria-label="テーマ"></select>
        </label>

        <label class="control">
          <span class="control__label">難易度</span>
          <select id="difficulty-select" aria-label="難易度">
            <option value="">難易度：すべて</option>
            <option value="1">難易度：1</option>
            <option value="2">難易度：2</option>
            <option value="3">難易度：3</option>
            <option value="4">難易度：4</option>
            <option value="5">難易度：5</option>
          </select>
        </label>

        <label class="control">
          <span class="control__label">タグ</span>
          <select id="tag-select" aria-label="タグ">
            <option value="">タグ：すべて</option>
          </select>
        </label>

        <button class="answer-all-button" id="answer-all-button" type="button">
          すべての答えを表示
        </button>
      </section>

      <section class="list-toolbar" aria-label="表示設定">
        <p id="result-count" aria-live="polite">問題を読み込んでいます</p>
        <div class="shortcut-help" aria-label="キーボードショートカット">
          <span><kbd>↑</kbd><kbd>↓</kbd> 問題を移動</span>
          <span><kbd>Space</kbd> 答えを開閉</span>
        </div>
        <label class="sort-control">
          <span>並び順</span>
          <select id="sort-select" aria-label="並び順">
            <option value="id">ID順</option>
            <option value="difficulty-asc">難易度：易しい順</option>
            <option value="difficulty-desc">難易度：難しい順</option>
          </select>
        </label>
      </section>

      <section id="quiz-list" class="quiz-list" aria-label="問題一覧"></section>

      <section id="empty-state" class="empty-state" hidden>
        <p class="empty-state__title">該当する問題がありません</p>
        <p>検索語や絞り込み条件を変えてください。</p>
        <button id="clear-filters-button" type="button">絞り込みを解除</button>
      </section>

      <section id="error-state" class="error-state" hidden role="alert">
        <p class="error-state__title">問題データを読み込めませんでした</p>
        <p id="error-message">しばらくしてから再読み込みしてください。</p>
      </section>
    </main>

    <div class="screen-reader-status" id="screen-reader-status" aria-live="polite"></div>

    <noscript>
      <p class="noscript-message">このページの表示にはJavaScriptが必要です。</p>
    </noscript>
  </body>
</html>
